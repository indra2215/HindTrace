              "software_versions": [
                "torch-2.2.1"
              ],
              "environment": "prod",
              "error_code": "EPOCH_RESTART_WORKER",
              "failure": "DataLoader worker crash after an epoch restart with a reusable dataset iterator.",
              "old_advice": "Set num_workers=0 for every DataLoader failure.",
              "old_advice_effect": "In this torch-2.2.1 prod case, that advice removed the worker crash but made the established throughput target fail.",
              "fix": "Keep the configured worker count and set persistent_workers=false for this reusable-iterator case.",
              "expected_result": "The worker is recreated at epoch restart without the reported crash."
            }
          ]
        }
      ],
      "evidence_text": "Runbook: RB-14 — Training worker recovery and step-8 decision\nStatus: superseded by PM-052.\nStep 8 is context-specific; the fixes must not be merged.\nStep 8 context A: torch-2.1.0, staging, error WORKER_EXIT_137; raising workers to 8 increased shared-memory pressure and worsened worker crashes. Fix: set num_workers=0.\nStep 8 context B: torch-2.2.1, prod, error EPOCH_RESTART_WORKER; universal num_workers=0 advice removed the crash but made the established throughput target fail. Fix: keep the configured worker count and set persistent_workers=false.\nDo not transfer either context-specific step-8 fix to the other context."
