          "text": "Apply only the matching context-specific fix; do not combine branches.",
          "preconditions": "torch version and environment are known.",
          "expected_result": "One branch is applied and rechecked.",
          "context_cases": [
            {
              "software_versions": [
                "torch-2.1.0"
              ],
              "environment": "staging",
              "error_code": "WORKER_EXIT_137",
              "failure": "DataLoader worker crash after worker count was raised to 8.",
              "old_advice": "Raise dataloader workers to 8.",
              "old_advice_effect": "The added workers increased shared-memory pressure and made the worker crashes worse.",
              "fix": "Set num_workers=0 for this torch-2.1.0 staging case.",
              "expected_result": "The DataLoader runs without the worker crash."
            },
