    {
      "id": "INC-201",
      "service_id": "checkout-api",
      "version": "v2.3",
      "date": "2024-03-12",
      "severity": "SEV2",
      "symptom": "HikariPool-1 - Connection is not available, request timed out after 30000ms",
      "trigger": "DEP-101",
      "root_cause": "The increased checkout concurrency exhausted the configured Hikari connection pool; checkout transactions held connections longer than the pool could replenish them.",
      "resolution": "Rolled back the concurrency increase and returned the pool to its prior configuration.",
      "status": "confirmed",
      "confirmed_by": "Omar Reed",
      "team": "web-dev",
      "services": [
        "checkout-api"
      ],
      "versions": [
        "v2.3"
      ],
      "evidence_text": "Incident: INC-201\nService: checkout-api\nVersion: v2.3\nDate: 2024-03-12\nSeverity: SEV2\nSymptom: HikariPool-1 - Connection is not available, request timed out after 30000ms\nTrigger: DEP-101\nRoot cause: The increased checkout concurrency exhausted the configured Hikari connection pool; checkout transactions held connections longer than the pool could replenish them.\nResolution: Rolled back the concurrency increase and returned the pool to its prior configuration.\nStatus: confirmed\nConfirmed by: Omar Reed"
    },
